<!DOCTYPE html>
<html>
<head>
    <title>collect da trash pretest release time</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #111;
            color: #fff;
        }
        #countdown {
            font-size: 2em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>collect da trash pretest release timelapse</h1>
    <div id="countdown">Loading countdown...</div>

    <script>
        const targetDate = new Date("October 3, 2025 00:00:00").getTime();

        const updateCountdown = () => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "Redirecting to collect da trash";
                window.location.href = "https://www.roblox.com/games/86070093893809/collect-da-trash-simulator";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        };

        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
